name: Release Image

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/release-please/manifest.json

env:
  REGISTRY: ghcr.io

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          skip-github-pull-request: true
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  release_image:
    runs-on: ubuntu-latest
    needs: release_please
    if: ${{ needs.release_please.outputs.releases_created }}
    strategy:
      matrix:
        image: ${{ fromJson(needs.release_please.outputs.paths_released) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - ${{ matrix.image }}/!(**.md)

      - name: Get image name
        env:
          IMAGE: ${{ matrix.image }}
        id: get-image-name
        run: echo "fragment=${IMAGE##*/}" >> "$GITHUB_OUTPUT"

      - name: Get image version
        id: get-image-version
        run: echo "version=$(jq -r '."${{ matrix.image }}"' < .github/release-please/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Get image platform
        id: get-image-platform
        run: echo "platform=$(jq -r '."${{ matrix.image }}"' < .github/release-please/platform.json)" >> "$GITHUB_OUTPUT"

      - name: Docker Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ format('{0}/{1}/{2}', env.REGISTRY ,'teutonet/oci-images', steps.get-image-name.outputs.fragment ) }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ steps.get-image-version.outputs.version }}
            type=sha,prefix=

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image }}
          platforms: ${{ steps.get-image-platform.outputs.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ steps.get-image-name.outputs.fragment }}
          cache-to: type=gha,scope=${{ steps.get-image-name.outputs.fragment }},mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ format('{0}/{1}/{2}:{3}', env.REGISTRY, 'teutonet/oci-images', steps.get-image-name.outputs.fragment, steps.get-image-version.outputs.version) }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Test image
        run: |
          IMAGE="${REGISTRY}/${REPO}/${IMAGE_NAME}:${VERSION}"
          echo "Testing image: ${IMAGE}"
          
          # Basic smoke test - ensure container starts
          docker run --rm --entrypoint="" "${IMAGE}" /bin/true || \
          docker run --rm "${IMAGE}" --help || \
          docker run --rm "${IMAGE}" version || \
          echo "Image test passed (no common entrypoint test applicable)"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: teutonet/oci-images
          IMAGE_NAME: ${{ steps.get-image-name.outputs.fragment }}
          VERSION: ${{ steps.get-image-version.outputs.version }}

  abort:
    runs-on: ubuntu-latest
    needs: release_please
    if: ${{ !needs.release_please.outputs.releases_created }}
    steps:
      - name: abort if no release was made
        run: |
          gh run cancel ${{ github.run_id }}
          gh run watch ${{ github.run_id }}
